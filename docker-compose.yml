services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/jinpanda11/usdt-income-bot:latest}
    container_name: usdt-income-bot
    restart: always
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    # pin version; latest may negotiate too-old Docker API against new daemons
    image: containrrr/watchtower:1.7.1
    container_name: usdt-income-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # newer Docker Engine rejects very old client API versions
      DOCKER_API_VERSION: "1.44"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
    command: ["--interval", "300", "--label-enable", "--cleanup"]
