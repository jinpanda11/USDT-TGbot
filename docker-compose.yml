services:
  bot:
    image: ${BOT_IMAGE:-ghcr.io/jinpanda11/usdt-income-bot:latest}
    container_name: usdt-income-bot
    restart: always
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    image: containrrr/watchtower:latest
    container_name: usdt-income-watchtower
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 仅当本机已 docker login 且 config.json 是文件时才需要；
      # 公开镜像可不挂载。若 /root/.docker/config.json 被误建成目录，请先删掉该目录。
      # - /root/.docker/config.json:/config.json:ro
    environment:
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_ROLLING_RESTART: "true"
    command: ["--interval", "300", "--label-enable", "--cleanup"]
